[package]
name = "zoo-module-client"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "What the app needs to talk to the zoo-module host: wire types and the Supervisor. No JS runtime."
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
regex = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt", "macros"] }
log = "0.4"
zoo-core = { path = "../zoo-core", optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock"], optional = true }
ts-rs = { version = "12", optional = true }

[features]
# The zoo-core Resolver adapter (ModuleResolver). Off in the host binary.
core = ["dep:zoo-core", "dep:chrono"]
# TypeScript bindings of the manifest types the app shows (Text).
ts = ["dep:ts-rs"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
