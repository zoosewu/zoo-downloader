[package]
name = "zoo-module"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Site module host (`zoo-module serve`) and module developer CLI. The only crate that links V8."
publish = false

[dependencies]
zoo-module-client = { path = "../zoo-module-client" }
deno_core = "0.413"
deno_error = "=0.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time", "net", "macros", "sync"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "cookies", "gzip", "brotli", "deflate"] }
sha1 = "0.11"
sha2 = "0.11"
getrandom = "0.4"
base64 = "0.23"
percent-encoding = "2"
clap = { version = "4.6", features = ["derive"] }

[dev-dependencies]
zoo-module-client = { path = "../zoo-module-client", features = ["core"] }
zoo-core = { path = "../zoo-core" }
chrono = "0.4"
tempfile = "3"
jsonschema = { version = "0.61", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
