[package]
name = "zoo-core"
version = "0.1.0"
edition = "2021"
description = "Download core for zoo-downloader. No Tauri or JS runtime dependencies."
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
url = "2.5"
percent-encoding = "2"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
log = "0.4"
ts-rs = { version = "12", features = ["chrono-impl", "uuid-impl", "serde-json-impl"] }
fs4 = "1.1.0"
regex = "1"
aes = "0.8"
ctr = "0.9"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "rt-multi-thread", "test-util", "net", "io-util"] }
