[package]
name = "zoo-native-host"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Browser-extension bridge: the protocol the app and the native messaging host share, and the host itself."
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
interprocess = "2.4"

[target.'cfg(unix)'.dependencies]
dirs = "7"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading"] }
