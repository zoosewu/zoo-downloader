[package]
name = "zoo-downloader"
version = "0.6.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "zoo_downloader_lib"
# Note: Removed "cdylib" because deno_core's V8 uses thread-local storage
# which is incompatible with shared libraries (Feature 004)
crate-type = ["staticlib", "rlib"]

[workspace]
members = ["crates/zoo-core", "crates/zoo-module-client", "crates/zoo-module", "crates/zoo-marketplace", "crates/zoo-native-host"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
zoo-core = { path = "crates/zoo-core" }
zoo-module-client = { path = "crates/zoo-module-client", features = ["core"] }
zoo-marketplace = { path = "crates/zoo-marketplace" }
zoo-native-host = { path = "crates/zoo-native-host" }
interprocess = { version = "2.4", features = ["tokio"] }
ts-rs = "12"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
clipboard-rs = "0.3"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
keyring-core = "1"
dirs = "7"
regex = "1"
log = "0.4"
trash = "5"
notify = "8"

[dev-dependencies]
tempfile = "3.8"


[target.'cfg(windows)'.dependencies]
winreg = "0.56"
widestring = "1"
windows-native-keyring-store = "1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
