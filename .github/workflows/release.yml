# Pushing a tag vX.Y.Z (see `pnpm release`) builds every platform; zoo-release publishes
# (https://github.com/zoosewu/zoo-release, docs/RELEASE.md).
#   build      one job per platform: installers, updater bundles signed with ZOO_SIGNING_KEY,
#              and the zoo-module CLI (the marketplace's CI runs it), as a release-<target> artifact
#   extension  the browser extension as a zip
#   release    zoo-release's shared workflow: sha256, notes from the commits (git-cliff) followed
#              by .github/release-notes.md, latest.json, a draft release, then publish. Nothing is
#              published until every platform is built.
# Built here rather than with zoo-release's tauri-build.yml: on macOS Tauri names the updater
# bundle <app>.app.tar.gz for both architectures, so each gets its architecture added here.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
            arch: aarch64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            arch: x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Version from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev patchelf
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - run: node scripts/version.mjs set "$VERSION"
      - name: Build
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.ZOO_SIGNING_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.ZOO_SIGNING_PASSWORD }}
        with:
          tauriScript: pnpm tauri
          args: --config src-tauri/tauri.bundle.json --target ${{ matrix.target }}
      - name: Collect
        env:
          PATHS: ${{ steps.tauri.outputs.artifactPaths }}
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
        run: |
          out="$RUNNER_TEMP/out"
          mkdir -p "$out"
          # Files only: artifactPaths also lists the .app folder, which the .app.tar.gz holds.
          python3 - <<'EOF'
          import json, os, shutil
          out = os.path.join(os.environ["RUNNER_TEMP"], "out")
          version, arch = os.environ["VERSION"], os.environ["ARCH"]
          for p in json.loads(os.environ["PATHS"]):
              if not os.path.isfile(p):
                  continue
              name = os.path.basename(p)
              for ext in (".app.tar.gz", ".app.tar.gz.sig"):
                  if name.endswith(ext):
                      name = f"zoo-downloader_{version}_{arch}{ext}"
              shutil.copy2(p, os.path.join(out, name))
              print(name)
          EOF
          cp src-tauri/binaries/zoo-module-"$TARGET"* "$out/"
          ls -la "$out"
          if ! ls "$out"/*.sig >/dev/null 2>&1; then
            echo "::error::no updater signature: are the ZOO_SIGNING_KEY and ZOO_SIGNING_PASSWORD secrets set?"; exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cd browser-extension && zip -r "$RUNNER_TEMP/zoo-downloader-browser-extension.zip" . -x 'test/*' -x 'node_modules/*'
      - uses: actions/upload-artifact@v7
        with:
          name: release-browser-extension
          path: ${{ runner.temp }}/zoo-downloader-browser-extension.zip
          if-no-files-found: error

  release:
    needs: [build, extension]
    uses: zoosewu/zoo-release/.github/workflows/release.yml@v1
    with:
      name: Zoo Downloader
      platforms: >-
        {"windows-x86_64": "*_x64-setup.exe",
         "darwin-aarch64": "*_aarch64.app.tar.gz",
         "darwin-x86_64": "*_x64.app.tar.gz",
         "linux-x86_64": "*_amd64.AppImage"}
      publish: false
    secrets: inherit
