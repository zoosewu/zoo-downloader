# Pushing a tag vX.Y.Z (see `pnpm release`) builds every platform and publishes the release.
#   prepare  check the versions, create a draft release with generated notes, attach the
#            browser extension
#   build    one job per platform: installers plus updater bundles signed with
#            the ZOO_SIGNING_KEY secret, and the zoo-module CLI; then the platform adds itself to
#            latest.json and publishes the release (the first one to finish makes it public), so
#            a slow or failed platform does not hold back the others. Installed apps find the
#            update through releases/latest/download/latest.json
#   finish   after every build, even failed ones: rewrite latest.json from all bundles (an entry
#            can be lost when two builds write at once) and fail if a platform is missing.
#            "Re-run failed jobs" builds the missing platform and runs this again.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/version.mjs check "$GITHUB_REF_NAME"
      - name: Draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The create response carries the id; listing releases right after may not show the draft yet.
          # The body (how to open the app on macOS) comes before the generated notes.
          id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$GITHUB_REF_NAME" \
            -f name="Zoo Downloader ${GITHUB_REF_NAME#v}" -F body=@.github/release-notes.md \
            -F draft=true -F generate_release_notes=true --jq .id)
          test -n "$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: Browser extension
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="zoo-downloader-browser-extension-${GITHUB_REF_NAME}.zip"
          (cd browser-extension && zip -r "../$name" . -x 'test/*' -x 'node_modules/*')
          gh release upload "$GITHUB_REF_NAME" "$name"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev patchelf
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.ZOO_SIGNING_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.ZOO_SIGNING_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          releaseDraft: true
          uploadUpdaterJson: false
          updaterJsonPreferNsis: true
          tauriScript: pnpm tauri
          args: --config src-tauri/tauri.bundle.json --target ${{ matrix.target }}
      # The site-module CLI on its own, for module developers and the marketplace's CI
      # (`zoo-module test` replays recorded cases), built by the step above as a sidecar.
      - name: zoo-module
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" src-tauri/binaries/zoo-module-${{ matrix.target }}*
      - name: Publish
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          TAG: ${{ github.ref_name }}
        run: |
          node scripts/updater-json.mjs
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest

  finish:
    needs: [prepare, build]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: latest.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          TAG: ${{ github.ref_name }}
        run: node scripts/updater-json.mjs --all
